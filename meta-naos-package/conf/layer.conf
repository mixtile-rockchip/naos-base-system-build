BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "naos-package"
BBFILE_PATTERN_naos-package = "^${LAYERDIR}/"
BBFILE_PRIORITY_naos-package = "30"
LAYERSERIES_COMPAT_naos-package = "wrynose"
LAYERDEPENDS_naos-package = "core naos naos-rockchip naos-security"

NAOS_PACKAGE_LAYER_DIR := "${LAYERDIR}"
NAOS_PACKAGE_PROVIDER = "naos-generator-inputs-v1"
addpylib ${LAYERDIR}/lib naos_package
