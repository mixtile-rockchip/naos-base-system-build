#@TYPE: Machine
#@NAME: Radxa AIRbox Q900
#@DESCRIPTION: NAOS for the QCS9075-based AIRbox Q900

require conf/machine/include/naos-qcs9075.inc

MACHINE_FEATURES += "efi kvm m2connector pci tpm2 phone"

QCOM_DTB_DEFAULT = "lemans-radxa-airbox-q900"
QCOM_UKI_DEVICETREE = "qcom/${QCOM_DTB_DEFAULT}.dtb"
KERNEL_DEVICETREE = "${QCOM_UKI_DEVICETREE}"
KERNEL_DTC_FLAGS:append = " -@"

QCOM_PARTITION_FILES_SUBDIR = "partitions/radxa-airbox-q900/ufs"
QCOM_CDT_FIRMWARE = "firmware-qcom-cdt-radxa-airbox-q900"
QCOM_CDT_FILE = "cdt_radxa_airbox_q900"

NAOS_Q900_XBL_CONFIG = "xbl_config_gunyah.elf"
NAOS_Q900_SIGNED_XBL_CONFIG = "xbl_config_gunyah-naos-signed.elf"
NAOS_Q900_SIGN_XBL_CONFIG ?= "0"
QCOM_XBL_CONFIG = "${NAOS_Q900_XBL_CONFIG}"

NAOS_Q900_SYSTEM_A_PARTUUID = "099c6bce-062a-543d-a895-bb1db785b1fe"
NAOS_Q900_SYSTEM_B_PARTUUID = "3d24017a-fdee-5d2a-9ed4-74123b3a179e"
NAOS_LAYOUT_COMPATIBLE = "naos-radxa-airbox-q900-ufs-v3${@'-disk-crypt' if d.getVar('NAOS_SYSTEM_ENCRYPTION') == '1' else '-data-crypt' if d.getVar('NAOS_DATA_ENCRYPTION') == '1' else ''}"

NAOS_SECURE_BOOT ?= "0"
NAOS_SECURE_BOOT_PROVIDER = "q900-uefi"
NAOS_SECURE_BOOT_KEY_DIR ?= "${NAOS_PROJECT_ROOT}/key/qcom-uefi-secure-boot"
NAOS_Q900_UEFI_AUTO_ENROLL ?= "0"
HOSTTOOLS_NONFATAL += "${@bb.utils.contains('NAOS_SECURE_BOOT', '1', 'sbsign sbverify', '', d)}"

NAOS_DISK_ENCRYPTION ?= "0"
NAOS_SYSTEM_ENCRYPTION ?= "${NAOS_DISK_ENCRYPTION}"
NAOS_DATA_ENCRYPTION ?= "${NAOS_DISK_ENCRYPTION}"
NAOS_SYSTEM_ENCRYPTION_PROVIDER = "qcs9075-hwkm"
NAOS_DATA_ENCRYPTION_PROVIDER = "qcs9075-hwkm"
NAOS_SYSTEM_KEY_DIR ?= "${NAOS_PROJECT_ROOT}/key/system-encryption"
INHERIT += "naos-disk-policy"
