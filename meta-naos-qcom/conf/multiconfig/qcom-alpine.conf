TMPDIR = "${TOPDIR}/tmp-alpine"
DISTRO = "naos"

BBMASK:remove = "/meta-naos/recipes-naos/ota/rauc[^/]*\.bbappend$"

HOSTTOOLS += "unshare"
ALPINE_DEFAULT_USER = "naos"
ALPINE_DEFAULT_PASSWORD = "naos"
ALPINE_CONSOLE_SHELL = "1"
ALPINE_SERVICES:append:naos-qcs9075 = " hwdrivers:sysinit"
ALPINE_ROOTFS_OVERLAY_DIRS:append:radxa-airbox-q900 = " ${NAOS_QCOM_LAYER_DIR}/recipes-core/images/files/q900-rootfs"
ALPINE_EXTRA_PACKAGES:append:radxa-airbox-q900 = " efibootmgr"
ALPINE_EXTRA_APK_LOCK:radxa-airbox-q900 = "${NAOS_QCOM_LAYER_DIR}/recipes-core/images/q900-efi-apks.inc"
IMAGE_FSTYPES:pn-naos-alpine-rootfs = "tar.gz"
