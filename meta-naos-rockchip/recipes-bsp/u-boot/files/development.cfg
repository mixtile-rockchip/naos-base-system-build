# Development boot images have no signature, rollback-key or FIT cipher path.
# SPL_FIT_SIGNATURE selects FIT_SIGNATURE, so both stages must be disabled.
# CONFIG_FIT_SIGNATURE is not set
# CONFIG_SPL_FIT_SIGNATURE is not set
# CONFIG_VPL_FIT_SIGNATURE is not set
# CONFIG_FIT_RSASSA_PSS is not set
# CONFIG_SPL_FIT_RSASSA_PSS is not set
# CONFIG_FIT_ENABLE_RSASSA_PSS_SUPPORT is not set
# CONFIG_FIT_ENABLE_RSA4096_SUPPORT is not set
# CONFIG_FIT_ROLLBACK_PROTECT is not set
# CONFIG_SPL_FIT_ROLLBACK_PROTECT is not set
# CONFIG_FIT_CIPHER is not set
# CONFIG_FIT_HW_CRYPTO is not set
# CONFIG_SPL_FIT_HW_CRYPTO is not set
# CONFIG_IMAGE_PRE_LOAD_SIG is not set
# CONFIG_SPL_IMAGE_PRE_LOAD_SIG is not set
# CONFIG_IMAGE_SIGN_INFO is not set
# CONFIG_SPL_IMAGE_SIGN_INFO is not set

# Target asymmetric verification is unnecessary for this unsigned boot path.
# Host mkimage/OpenSSL remain available to create FITs and checksum digests.
# CONFIG_RSA is not set
# CONFIG_SPL_RSA is not set
# CONFIG_RSA_VERIFY is not set
# CONFIG_SPL_RSA_VERIFY is not set
# CONFIG_RSA_VERIFY_WITH_PKEY is not set
# CONFIG_SPL_RSA_VERIFY_WITH_PKEY is not set
# CONFIG_RSA_SOFTWARE_EXP is not set
# CONFIG_ROCKCHIP_RSA is not set
# CONFIG_SPL_ROCKCHIP_RSA is not set
# CONFIG_RSA_PUBLIC_KEY_PARSER is not set
# CONFIG_SPL_RSA_PUBLIC_KEY_PARSER is not set
# CONFIG_ASYMMETRIC_KEY_TYPE is not set
# CONFIG_SPL_ASYMMETRIC_KEY_TYPE is not set
# CONFIG_ECDSA is not set
# CONFIG_ECDSA_VERIFY is not set
# CONFIG_SPL_ECDSA_VERIFY is not set
# CONFIG_ROCKCHIP_EC is not set
# CONFIG_SPL_ROCKCHIP_EC is not set
# CONFIG_CMD_CRYPTO is not set
# CONFIG_WGET_HTTPS is not set
# CONFIG_EFI_SECURE_BOOT is not set
# CONFIG_EFI_CAPSULE_AUTHENTICATE is not set

# No FIT encryption or target cipher command is included in development.
# CONFIG_AES is not set
# CONFIG_CMD_AES is not set
# CONFIG_DM_CIPHER is not set
# CONFIG_ROCKCHIP_CIPHER is not set
# CONFIG_SPL_ROCKCHIP_CIPHER is not set

# Keep ordinary hardware-ID OTP access. The separate writable secure-OTP
# driver is only needed by FIT enforcement, key provisioning and rollback here.
# CONFIG_ROCKCHIP_SECURE_OTP is not set
# CONFIG_SPL_ROCKCHIP_SECURE_OTP is not set
# CONFIG_SPL_OTP_DISABLE_SD is not set
# CONFIG_SPL_OTP_DISABLE_USB is not set
# CONFIG_SPL_OTP_DISABLE_UART is not set
# CONFIG_SPL_OTP_DISABLE_SPI2APB is not set
# CONFIG_SPL_REVOKE_PUB_KEY is not set

# Development U-Boot does not use the OP-TEE client. The existing vendor FIT
# policy then uses the preloader's key tag instead of querying TEE services.
# This does not change the independently packaged BL32 or the Linux TEE driver.
# CONFIG_TEE is not set
# CONFIG_OPTEE is not set
# CONFIG_ROCKCHIP_OPTEE_V2 is not set
# CONFIG_ROCKCHIP_OPTEE_V3 is not set
# CONFIG_RNG_OPTEE is not set
# CONFIG_SCMI_AGENT_OPTEE is not set
# CONFIG_OPTEE_LIB is not set
# CONFIG_OPTEE_IMAGE is not set
# CONFIG_BOOTM_OPTEE is not set
# CONFIG_OPTEE_ALWAYS_USE_SECURITY_PARTITION is not set

# FIT structure and payload hash checks are useful without authentication.
CONFIG_FIT=y
CONFIG_SPL_FIT=y
CONFIG_SPL_LOAD_FIT=y
CONFIG_FIT_FULL_CHECK=y
CONFIG_SPL_FIT_FULL_CHECK=y
CONFIG_HASH=y
CONFIG_SPL_HASH=y
CONFIG_SHA256=y
CONFIG_SPL_SHA256=y

# The vendor FIT hash path uses driver-model hashing in both boot stages.
# Keep the hash framework/drivers in SPL; these options do not enable signing.
CONFIG_DM_HASH=y
CONFIG_HASH_SOFTWARE=y
CONFIG_CRYPTO_MANAGER=y
CONFIG_SPL_CRYPTO=y
CONFIG_SPL_CRYPTO_MANAGER=y
