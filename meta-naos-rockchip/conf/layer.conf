BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "naos-rockchip"
BBFILE_PATTERN_naos-rockchip = "^${LAYERDIR}/"
BBFILE_PRIORITY_naos-rockchip = "10"
LAYERSERIES_COMPAT_naos-rockchip = "wrynose"
LAYERDEPENDS_naos-rockchip = "core naos"
NAOS_ROCKCHIP_LAYER_DIR := "${LAYERDIR}"
NAOS_LAYOUT_FILE ?= "${NAOS_ROCKCHIP_LAYER_DIR}/recipes-core/images/files/${MACHINE}.json"
LICENSE_PATH:append := " ${LAYERDIR}/licenses"
NAOS_SBOM_COMPONENT_EXTENSION = "naos_rockchip.sbom:extend_component"
NAOS_SBOM_EXTENSION_DIR := "${LAYERDIR}/lib/naos_rockchip"
addpylib ${LAYERDIR}/lib naos_rockchip
