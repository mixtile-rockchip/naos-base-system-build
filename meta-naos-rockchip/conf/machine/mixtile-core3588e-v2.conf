# Mixtile Core3588E v2, Rockchip vendor BSP.
require conf/machine/include/arm/armv8-2a/tune-cortexa76-cortexa55.inc

MACHINEOVERRIDES =. "rk3588:"
MACHINE_FEATURES = "usbhost usbgadget pci wifi bluetooth rtc ext2"
SERIAL_CONSOLES = "1500000;ttyFIQ0"

PREFERRED_PROVIDER_virtual/kernel = "linux-naos-rockchip"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-naos-rockchip"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/mixtile-core3588e-v2.dtb"
KERNEL_DTBVENDORED = "0"
UBOOT_MACHINE = "mixtile-core3588e-v2_defconfig"

# Recipes pin the exact commits; local experiments can override these in
# the ignored build/local.yml.
NAOS_RK_KERNEL_URI ?= "git://github.com/mixtile-rockchip/mixtile-sdk-rk-kernel.git;protocol=https;branch=rk3588-linux-6.12-stan-rkr1"
NAOS_RK_UBOOT_URI ?= "git://github.com/mixtile-rockchip/mixtile-sdk-android-rk-u-boot.git;protocol=https;branch=rk3588-linux-6.12-stan-rkr1"
NAOS_RK_RKBIN_URI ?= "git://github.com/mixtile-rockchip/mixtile-sdk-rk-rkbin.git;protocol=https;branch=rk3588-linux-6.12-stan-rkr1"

# Export the storage contract to image assembly and runtime configuration.
# This on-disk/OTA identity predates the machine-name rename and stays stable.
NAOS_LAYOUT_COMPATIBLE = "naos-mixtile-core3588e-v2-nano-v1"
NAOS_BOOTLOADER_PROVIDER = "u-boot-naos-rockchip"
NAOS_BOOTLOADER_OFFSET = "8388608"
NAOS_ENV_OFFSET = "13631488"
NAOS_ENV_OFFSET_REDUND = "13697024"
NAOS_ENV_SIZE = "32768"
NAOS_MMC_DEVICE = "0"
