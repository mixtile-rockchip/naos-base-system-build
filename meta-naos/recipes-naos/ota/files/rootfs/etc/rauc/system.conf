[system]
compatible=naos-mixtile-core3588e-v2-nano-v1
bootloader=uboot
boot-attempts=3
boot-attempts-primary=3
bundle-formats=verity
data-directory=/var/lib/rauc
mountprefix=/run/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.A]
device=/dev/naos/system_a
type=raw
bootname=A

[slot.rootfs.B]
device=/dev/naos/system_b
type=raw
bootname=B

[slot.boot.A]
device=/dev/naos/boot_a
type=raw
parent=rootfs.A

[slot.boot.B]
device=/dev/naos/boot_b
type=raw
parent=rootfs.B

# Shared bootloader components are present only in the separate bootloader
# bundle. Each region is split into primary and fallback locations by RAUC.
[slot.uboot.0]
device=/dev/naos/uboot
type=boot-raw-fallback
region-start=0
region-size=4M

[slot.idb.0]
device=/dev/naos/disk
type=boot-raw-fallback
region-start=32K
region-size=1M
