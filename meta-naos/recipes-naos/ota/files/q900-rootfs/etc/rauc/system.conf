[system]
compatible=naos-radxa-airbox-q900-ufs-v3
bootloader=custom
bundle-formats=verity
data-directory=/var/lib/rauc
mountprefix=/run/rauc

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/lib/naos/q900-boot
pre-install=/usr/lib/naos/q900-boot

[slot.rootfs.A]
device=/dev/naos/system_a
type=raw
bootname=A

[slot.rootfs.B]
device=/dev/naos/system_b
type=raw
bootname=B

[slot.boot.A]
device=/dev/naos/boot_a
type=raw
parent=rootfs.A

[slot.boot.B]
device=/dev/naos/boot_b
type=raw
parent=rootfs.B
