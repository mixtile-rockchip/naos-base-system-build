BBPATH .= ":${LAYERDIR}"
addpylib ${LAYERDIR}/lib naos
# Resolve the checkout at build time; callers may override the project root.
NAOS_LAYER_DIR := "${LAYERDIR}"
NAOS_PROJECT_ROOT ?= "${@os.path.dirname(d.getVar('NAOS_LAYER_DIR'))}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "naos"
BBFILE_PATTERN_naos = "^${LAYERDIR}/"
BBFILE_PRIORITY_naos = "8"
LAYERSERIES_COMPAT_naos = "wrynose"
LAYERDEPENDS_naos = "core openembedded-layer rauc"
