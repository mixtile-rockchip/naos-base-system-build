DISTRO = "naos"
DISTRO_NAME = "NAOS"
DISTRO_VERSION = "2.0-dev"
MAINTAINER = "NAOS maintainers"

# Source-built RAUC, initramfs and target helpers share a fixed musl toolchain.
# The Alpine base userspace is assembled independently from official APKs.
TCLIBC = "musl"
require conf/distro/include/naos-toolchain.inc
REQUIRED_VERSION_rauc-hawkbit-updater = "1.4"
# The Alpine assembler creates an isolated user/mount/PID/IPC namespace.
# BitBake's restricted host-tool PATH must expose the host util-linux helper.
HOSTTOOLS += "unshare"
INIT_MANAGER = "mdev-busybox"
# Wrynose appends DISTRO_FEATURES_DEFAULTS even when DISTRO_FEATURES is set.
# Keep this embedded distro's explicit feature selection without implicit
# ptest, desktop or debuginfod dependencies.
DISTRO_FEATURES_DEFAULTS = ""
DISTRO_FEATURES = "acl ext2 ipv4 ipv6 pci rauc seccomp usbhost usbgadget xattr"
PACKAGE_CLASSES = "package_ipk"
IMAGE_LINGUAS = ""
INHERIT_DISTRO = "devshell sstate license remove-libtool buildstats"
INHERIT_DISTRO:append = "${@' create-spdx naos-sbom-component' if d.getVar('NAOS_SBOM') == '1' else ''}"

NAOS_BUILD_MODE ?= "development"
NAOS_OTA ?= "0"
NAOS_PACKAGE ?= "0"
NAOS_SBOM ?= "${@'1' if d.getVar('NAOS_BUILD_MODE') == 'production' else '0'}"
# Include the final kernel CONFIG_* values in the enabled Yocto SPDX output.
SPDX_INCLUDE_KERNEL_CONFIG = "${NAOS_SBOM}"
NAOS_SECURE_BOOT ?= "${@'1' if d.getVar('NAOS_BUILD_MODE') == 'production' else '0'}"
NAOS_DISK_ENCRYPTION ?= "${@'1' if d.getVar('NAOS_BUILD_MODE') == 'production' else '0'}"
NAOS_SYSTEM_ENCRYPTION ?= "${NAOS_DISK_ENCRYPTION}"
NAOS_DATA_ENCRYPTION ?= "${NAOS_DISK_ENCRYPTION}"
NAOS_VERSION ?= "2.0.0-dev"
NAOS_BUILD_ID ?= "${NAOS_VERSION}"

INHERIT += "naos-policy"
