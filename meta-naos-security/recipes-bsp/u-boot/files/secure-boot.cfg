# Signed RK3588 firmware and OS FITs; no disk or FIT encryption.
CONFIG_FIT=y
CONFIG_SPL_FIT=y
CONFIG_SPL_LOAD_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_SPL_FIT_SIGNATURE=y
CONFIG_FIT_FULL_CHECK=y
CONFIG_SPL_FIT_FULL_CHECK=y
CONFIG_FIT_RSASSA_PSS=y
CONFIG_SPL_FIT_RSASSA_PSS=y
CONFIG_FIT_ENABLE_RSASSA_PSS_SUPPORT=y
# CONFIG_FIT_ENABLE_RSA4096_SUPPORT is not set
CONFIG_FIT_HW_CRYPTO=y
CONFIG_SPL_FIT_HW_CRYPTO=y
CONFIG_RSA=y
CONFIG_SPL_RSA=y
CONFIG_RSA_VERIFY=y
CONFIG_SPL_RSA_VERIFY=y
CONFIG_ROCKCHIP_RSA=y
CONFIG_SPL_ROCKCHIP_RSA=y
CONFIG_ROCKCHIP_SECURE_OTP=y
CONFIG_SPL_ROCKCHIP_SECURE_OTP=y
CONFIG_CONSOLE_DISABLE_CLI=y
CONFIG_BOOTDELAY=-2
CONFIG_ENV_WRITEABLE_LIST=y
CONFIG_ENV_ACCESS_IGNORE_FORCE=y
# CONFIG_FIT_ROLLBACK_PROTECT is not set
# CONFIG_SPL_FIT_ROLLBACK_PROTECT is not set
# CONFIG_SPL_REVOKE_PUB_KEY is not set
# CONFIG_SPL_OTP_DISABLE_SD is not set
# CONFIG_SPL_OTP_DISABLE_USB is not set
# CONFIG_SPL_OTP_DISABLE_UART is not set
# CONFIG_SPL_OTP_DISABLE_SPI2APB is not set
# CONFIG_FIT_CIPHER is not set
# CONFIG_AES is not set
# CONFIG_CMD_AES is not set
# CONFIG_DM_CIPHER is not set
# CONFIG_ROCKCHIP_CIPHER is not set
# CONFIG_SPL_ROCKCHIP_CIPHER is not set
# CONFIG_TEE is not set
# CONFIG_OPTEE is not set
# CONFIG_ROCKCHIP_OPTEE_V2 is not set
# CONFIG_ROCKCHIP_OPTEE_V3 is not set
# CONFIG_RNG_OPTEE is not set
# CONFIG_SCMI_AGENT_OPTEE is not set
# CONFIG_OPTEE_LIB is not set
# CONFIG_OPTEE_IMAGE is not set
# CONFIG_BOOTM_OPTEE is not set
# CONFIG_OPTEE_ALWAYS_USE_SECURITY_PARTITION is not set
# CONFIG_USE_PREBOOT is not set
# CONFIG_CMD_GO is not set
# CONFIG_CMD_BOOTI is not set
# CONFIG_CMD_BOOTZ is not set
# CONFIG_CMD_BOOTEFI is not set
# CONFIG_CMD_ELF is not set
