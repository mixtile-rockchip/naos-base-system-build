BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "naos-security"
BBFILE_PATTERN_naos-security = "^${LAYERDIR}/"
BBFILE_PRIORITY_naos-security = "20"
LAYERSERIES_COMPAT_naos-security = "wrynose"
LAYERDEPENDS_naos-security = "core naos naos-rockchip"

NAOS_SECURE_BOOT_PROVIDER = "rk3588-fit"
NAOS_DATA_ENCRYPTION_PROVIDER = "rk3588-tee-trusted"
NAOS_SYSTEM_ENCRYPTION_PROVIDER = "rk3588-huk"
NAOS_SYSTEM_KEY_DIR ?= "${NAOS_PROJECT_ROOT}/key/system-encryption"
NAOS_SSH_CA_KEY ?= "${NAOS_PROJECT_ROOT}/key/ssh-ca/ssh_ca_key.pub"
NAOS_RK_TEE_USER_URI ?= "git://github.com/mixtile-rockchip/mixtile-sdk-android-rk-platform-system-rk_tee_user.git;protocol=https;branch=rk3588-linux-6.12-stan-rkr1"
NAOS_SECURITY_TOOL_URI ?= "git://github.com/mixtile-rockchip/security-tool.git;protocol=https;branch=main"
NAOS_SECURITY_TOOL_SRCREV ?= "e883e1be1f3ac69ab11ddd22a47e205e81c3d81a"
NAOS_SECURE_BOOT_KEY_DIR ?= "${NAOS_PROJECT_ROOT}/key/secure-boot"
NAOS_SECURE_BOOT_BURN_KEY_HASH ?= "0"
INHERIT += "naos-secure-boot"
